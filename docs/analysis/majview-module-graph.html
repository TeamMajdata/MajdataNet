  :root {
    --bg: #080b10;

    --muted: #8b9bb0;
    --engine: #22d3ee;
    --song: #f59e0b;
    --page: #e879f9;

  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(1200px 800px at 30% 0%, #0f1723 0%, var(--bg) 55%);

  }
  #stage { position: fixed; inset: 0; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  canvas { display: block; width: 100%; height: 100%; }

  .hud { position: fixed; z-index: 5; }

  #title { top: 18px; left: 20px; max-width: 46ch; pointer-events: none; }
  #title h1 { margin: 0 0 4px; font-size: 15px; font-weight: 650; letter-spacing: .2px; }
  #title p { margin: 0; color: var(--muted); font-size: 11.5px; line-height: 1.55; }
  #title code { color: var(--engine); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  #legend {
    left: 20px; bottom: 18px; padding: 10px 12px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(12px);
    display: flex; flex-direction: column; gap: 5px; font-size: 11.5px;
  }
  #legend .row { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
  #legend .row:hover { color: #fff; }
  #legend .row.off { opacity: .3; text-decoration: line-through; }
  #legend .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  #legend .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; padding-left: 8px; }
  #legend hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0 2px; width: 100%; }
  #legend .key { color: var(--muted); font-size: 11px; display: flex; align-items: center; gap: 6px; }
  #legend .swatch { width: 22px; height: 0; border-top: 2px solid; flex: none; }

  #panel {
    top: 16px; right: 16px; bottom: 16px; width: 336px; max-width: calc(100vw - 32px);
    padding: 14px 15px; border-radius: 12px; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(14px);
    display: flex; flex-direction: column; gap: 12px;
  }
  #panel::-webkit-scrollbar { width: 8px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 4px; }

  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .metric { padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,.035); border: 1px solid var(--line); }
  .metric .k { color: var(--muted); font-size: 10.5px; letter-spacing: .3px; text-transform: uppercase; }
  .metric .v { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.25; }
  .metric .v small { font-size: 10.5px; font-weight: 400; color: var(--muted); }

  .tools { display: flex; flex-wrap: wrap; gap: 6px; }
  button.chip {
    font: inherit; font-size: 11.5px; color: var(--text); background: rgba(255,255,255,.05);
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; cursor: pointer; transition: .15s;
  }
  button.chip:hover { background: rgba(255,255,255,.11); }
  button.chip[aria-pressed="true"] { background: rgba(34,211,238,.16); border-color: rgba(34,211,238,.5); color: #a5f3fc; }

  input[type="search"] {
    font: inherit; font-size: 12px; width: 100%; color: var(--text);
    background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; outline: none;
  }
  input[type="search"]:focus { border-color: rgba(34,211,238,.5); }

  #detail { font-size: 12px; }
  #detail h2 { margin: 0 0 2px; font-size: 13px; font-weight: 600; word-break: break-all; }
  #detail .path { color: var(--muted); font-size: 11px; font-family: ui-monospace, Menlo, Consolas, monospace; word-break: break-all; }
  #detail .tag { display: inline-block; margin: 6px 0 0; padding: 1px 8px; border-radius: 999px; font-size: 10.5px; }
  #detail h3 { margin: 12px 0 5px; font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .4px; text-transform: uppercase; }
  #detail ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
  #detail li { padding: 3px 7px; border-radius: 6px; cursor: pointer; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; color: #cfe0f0; word-break: break-all; }
  #detail li:hover { background: rgba(255,255,255,.08); }
  #detail li .k { color: var(--muted); }
  .empty { color: var(--muted); font-size: 11.5px; }
  .hint { color: var(--muted); font-size: 11px; line-height: 1.6; }

  #tip {
    position: fixed; z-index: 20; pointer-events: none; opacity: 0; transition: opacity .1s;
    padding: 5px 9px; border-radius: 7px; background: rgba(8,11,16,.95); border: 1px solid var(--line);
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; white-space: nowrap;
  }
  @media (max-width: 880px) {
    #panel { width: 270px; }
    #title { max-width: 40vw; }
  }
</style>
</head>

  </div>
</div>

<script>
(() => {
  "use strict";
  const stage = document.getElementById("stage");
  const canvas = document.getElementById("cv");
  const ctx = canvas.getContext("2d");
  const tip = document.getElementById("tip");
  const detail = document.getElementById("detail");
  const legendEl = document.getElementById("legend");
  const metricsEl = document.getElementById("metrics");
  const qEl = document.getElementById("q");

  // ---------- 聚类 ----------
  const CLUSTERS = {
    engine: { label: "src/majview 引擎", color: "#22d3ee" },
    song:   { label: "components/song", color: "#f59e0b" },
    page:   { label: "SongPage", color: "#e879f9" },
    ui:     { label: "components/ui 等", color: "#a78bfa" },
    hooks:  { label: "hooks", color: "#34d399" },
    utils:  { label: "utils", color: "#60a5fa" },
    types:  { label: "types", color: "#94a3b8" },
    config: { label: "config/api", color: "#fb7185" },
    i18n:   { label: "i18n / locales", color: "#fbbf24" },
    other:  { label: "其它", color: "#64748b" },
  };
  const ORDER = ["engine", "song", "page", "hooks", "utils", "types", "config", "ui", "i18n", "other"];

  function clusterOf(id) {
    if (id.startsWith("majview/")) return "engine";
    if (id.startsWith("components/song/")) return "song";
    if (id === "pages/SongPage.tsx") return "page";
    if (id.startsWith("hooks/")) return "hooks";
    if (id.startsWith("utils/")) return "utils";
    if (id.startsWith("types/")) return "types";
    if (id === "config/api.ts" || id.startsWith("config/")) return "config";
    if (id.startsWith("i18n/") || id.startsWith("locales/")) return "i18n";
    if (id.startsWith("components/")) return "ui";
    return "other";
  }

  // ---------- 建图 ----------
  const nodes = [];
  const byId = new Map();
  for (const n of DATA.nodes) {
    const node = { id: n.id, label: n.id.split("/").pop(), lines: n.lines, cluster: clusterOf(n.id), x: 0, y: 0, vx: 0, vy: 0, deg: 0 };
    nodes.push(node); byId.set(node.id, node);
  }
  // 边指向的 data/样式文件也画出来（generated/paths.json 之类）
  const edges = [];
  for (const e of DATA.edges) {
    if (!byId.has(e.to)) {
      const synthetic = { id: e.to, label: e.to.split("/").pop(), lines: 0, cluster: "other", x: 0, y: 0, vx: 0, vy: 0, deg: 0, asset: true };
      nodes.push(synthetic); byId.set(synthetic.id, synthetic);
    }
    if (!byId.has(e.from)) continue;
    const a = byId.get(e.from), b = byId.get(e.to);
    a.deg++; b.deg++;
    edges.push({ a, b, kind: e.kind || "static", cross: a.cluster !== b.cluster });
  }

  // ---------- 初始布局：按聚类摆成一圈 ----------
  const R = 380;
  const anchors = new Map(ORDER.map((c, i) => {
    const ang = (i / ORDER.length) * Math.PI * 2 - Math.PI / 2;
    return [c, { x: Math.cos(ang) * R * 1.18, y: Math.sin(ang) * R * 0.74 }];
  }));
  for (const n of nodes) {
    const a = anchors.get(n.cluster) || { x: 0, y: 0 };
    n.x = a.x + (Math.random() - 0.5) * 130;
    n.y = a.y + (Math.random() - 0.5) * 130;
  }

  const REP = 7200, SPRING = 0.006, CLUSTER_PULL = 0.034, DAMP = 0.84;
  function simulate(steps) {
    for (let s = 0; s < steps; s++) {
      const alpha = 1 - s / steps;
      // 斥力
      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i];
        for (let j = i + 1; j < nodes.length; j++) {
          const b = nodes[j];
          let dx = b.x - a.x, dy = b.y - a.y;
          let d2 = dx * dx + dy * dy;
          if (d2 < 1) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 1; }
          if (d2 > 90000) continue;
          const f = REP / d2;
          const d = Math.sqrt(d2);
          const ux = dx / d, uy = dy / d;
          a.vx -= ux * f; a.vy -= uy * f;
          b.vx += ux * f; b.vy += uy * f;
        }
      }
      // 弹簧
      for (const e of edges) {
        const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y;
        const d = Math.sqrt(dx * dx + dy * dy) || 1;
        const rest = e.kind === "dynamic" ? 250 : 78;
        const f = (d - rest) * SPRING;
        const ux = dx / d, uy = dy / d;
        e.a.vx += ux * f; e.a.vy += uy * f;
        e.b.vx -= ux * f; e.b.vy -= uy * f;
      }
      // 聚类向心 + 阻尼
      for (const n of nodes) {
        const a = anchors.get(n.cluster);
        if (a) { n.vx += (a.x - n.x) * CLUSTER_PULL; n.vy += (a.y - n.y) * CLUSTER_PULL; }
        n.vx *= DAMP; n.vy *= DAMP;
        n.x += n.vx * alpha; n.y += n.vy * alpha;
      }
    }
  }
  simulate(520);

  // ---------- 视图状态 ----------
  const view = { x: 0, y: 0, k: 1 };
  let hover = null, selected = null, dragging = null, panning = null, mode = "all", query = "", offClusters = new Set();
  const DPR = () => Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    const dpr = DPR();
    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
    draw();
  }
  addEventListener("resize", resize);

  function fit(ids) {
    const list = ids && ids.length ? ids.map((i) => byId.get(i)).filter(Boolean) : nodes;
    if (!list.length) return;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const n of list) { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x); y1 = Math.max(y1, n.y); }
    const w = Math.max(x1 - x0, 60), h = Math.max(y1 - y0, 60);
    const k = Math.min((innerWidth - panelW() - 90) / (w + 160), (innerHeight - 140) / (h + 160), 1.6);
    view.k = Math.max(k, 0.15);
    view.x = (x0 + x1) / 2;
    view.y = (y0 + y1) / 2;
  }

  const radiusOf = (n) => (n.asset ? 2.6 : Math.min(3 + Math.sqrt(n.lines) * 0.7 + Math.min(n.deg, 24) * 0.26, 20));

  function visible(n) {
    if (offClusters.has(n.cluster)) return false;
    if (mode === "focus" && n.cluster !== "engine" && n.cluster !== "song" && n.cluster !== "page") return false;
    if (query && !n.id.toLowerCase().includes(query)) return false;
    return true;
  }
  function edgeVisible(e) {
    if (!visible(e.a) || !visible(e.b)) return false;
    if (mode === "cross" && !e.cross) return false;
    return true;
  }

  // ---------- 绘制 ----------
  const panelW = () => (innerWidth > 880 ? 356 : 0);
  const centerX = () => (innerWidth - panelW()) / 2 + 6;

  function draw() {
    const dpr = DPR();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ctx.save();
    ctx.translate(centerX(), innerHeight / 2);
    ctx.scale(view.k, view.k);
    ctx.translate(-view.x, -view.y);

    const focusNode = selected || hover;
    const nbr = new Set();
    if (focusNode) {
      for (const e of edges) {
        if (e.a === focusNode) nbr.add(e.b);
        if (e.b === focusNode) nbr.add(e.a);
      }
    }

    // 边
    for (const e of edges) {
      if (!edgeVisible(e)) continue;
      const active = focusNode && (e.a === focusNode || e.b === focusNode);
      let alpha = e.cross ? 0.3 : 0.065;
      let color = e.cross ? "rgba(160,190,220,0.95)" : "rgba(120,145,175,0.9)";
      if (e.kind === "dynamic") { color = "rgba(251,191,36,0.95)"; alpha = 0.75; }
      if (focusNode) {
        if (active) { alpha = e.a === focusNode ? 0.95 : 0.8; color = e.a === focusNode ? "#22d3ee" : "#e879f9"; }
        else alpha = 0.045;
      }
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = color;
      ctx.lineWidth = (active ? 1.5 : 0.7) / view.k;
      if (e.kind === "dynamic") ctx.setLineDash([5 / view.k, 4 / view.k]);
      else if (e.asset) ctx.setLineDash([1.5 / view.k, 3 / view.k]);
      else ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(e.a.x, e.a.y);
      ctx.lineTo(e.b.x, e.b.y);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;

    // 聚类标签：画在每个色块的重心上方
    const sums = new Map();
    for (const n of nodes) {
      if (!visible(n)) continue;
      const s = sums.get(n.cluster) || { x: 0, y: 0, n: 0, top: Infinity };
      s.x += n.x; s.y += n.y; s.n++; s.top = Math.min(s.top, n.y); sums.set(n.cluster, s);
    }
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    for (const [c, s] of sums) {
      if (s.n < 2) continue;
      const label = CLUSTERS[c].label;
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = CLUSTERS[c].color;
      ctx.font = `600 ${13 / view.k}px ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif`;
      ctx.fillText(label, s.x / s.n, s.top - 22 / view.k);
    }
    ctx.globalAlpha = 1;

    // 节点
    for (const n of nodes) {
      if (!visible(n)) continue;
      const r = radiusOf(n);
      const c = CLUSTERS[n.cluster].color;
      const isFocus = n === focusNode;
      const isNbr = nbr.has(n);
      const dim = focusNode && !isFocus && !isNbr;
      ctx.globalAlpha = dim ? 0.18 : 1;
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      ctx.fillStyle = c;
      ctx.fill();
      if (isFocus || (isNbr && view.k > 0.7)) {
        ctx.strokeStyle = isFocus ? "#fff" : c;
        ctx.lineWidth = (isFocus ? 2 : 1.2) / view.k;
        ctx.stroke();
      }
      // 标签：放大 / 悬停 / 高亮时才画，避免糊成一片
      const showLabel = isFocus || isNbr || view.k > 1.1 || n.deg >= 8
        || (n.cluster === "engine" && view.k > 0.62);
      if (showLabel && !n.asset) {
        ctx.globalAlpha = dim ? 0.25 : 1;
        const size = (isFocus ? 12 : 10) / view.k;
        const label = n.label;
        const lx = n.x + r + 5 / view.k;
        ctx.font = `${size}px ui-monospace, Menlo, Consolas, monospace`;
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        // 先描一圈深色底，压住背后的连线，标签才读得清
        ctx.lineWidth = 3 / view.k;
        ctx.strokeStyle = "rgba(8,11,16,0.92)";
        ctx.strokeText(label, lx, n.y);
        ctx.fillStyle = isFocus ? "#fff" : "rgba(214,228,242,0.92)";
        ctx.fillText(label, lx, n.y);
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ---------- 命中测试 ----------
  function pick(mx, my) {
    let best = null, bestD = Infinity;
    for (const n of nodes) {
      if (!visible(n)) continue;
      const sx = (n.x - view.x) * view.k + centerX();
      const sy = (n.y - view.y) * view.k + innerHeight / 2;
      const d = Math.hypot(sx - mx, sy - my);
      const r = Math.max(radiusOf(n) * view.k, 7);
      if (d < r && d < bestD) { best = n; bestD = d; }
    }
    return best;
  }
  const toWorld = (mx, my) => ({ x: (mx - centerX()) / view.k + view.x, y: (my - innerHeight / 2) / view.k + view.y });

  // ---------- 交互 ----------
  canvas.addEventListener("pointerdown", (ev) => {
    canvas.setPointerCapture(ev.pointerId);
    const hit = pick(ev.clientX, ev.clientY);
    if (hit) { dragging = { node: hit, dx: hit.x - toWorld(ev.clientX, ev.clientY).x, dy: hit.y - toWorld(ev.clientX, ev.clientY).y }; }
    else { panning = { sx: ev.clientX, sy: ev.clientY, vx: view.x, vy: view.y }; stage.classList.add("dragging"); }
  });

  canvas.addEventListener("pointermove", (ev) => {
    if (dragging) {
      const w = toWorld(ev.clientX, ev.clientY);
      dragging.node.x = w.x + dragging.dx;
      dragging.node.y = w.y + dragging.dy;
      draw();
      return;
    }
    if (panning) {
      view.x = panning.vx - (ev.clientX - panning.sx) / view.k;
      view.y = panning.vy - (ev.clientY - panning.sy) / view.k;
      draw();
      return;
    }
    const hit = pick(ev.clientX, ev.clientY);
    if (hit !== hover) { hover = hit; canvas.style.cursor = hit ? "pointer" : "grab"; draw(); }
    if (hit) {
      tip.textContent = `${hit.id}  ·  ${hit.lines || "—"} 行  ·  ${hit.deg} 条连线`;
      tip.style.opacity = "1";
      tip.style.left = Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px";
      tip.style.top = ev.clientY + 16 + "px";
    } else tip.style.opacity = "0";
  });

  canvas.addEventListener("pointerup", (ev) => {
    if (dragging && Math.abs(ev.clientX) > 0) select(dragging.node);
    dragging = null;
    panning = null;
    stage.classList.remove("dragging");
  });

  canvas.addEventListener("pointerleave", () => { tip.style.opacity = "0"; hover = null; draw(); });

  canvas.addEventListener("wheel", (ev) => {
    ev.preventDefault();
    const w = toWorld(ev.clientX, ev.clientY);
    const factor = Math.exp(-ev.deltaY * 0.0015);
    view.k = Math.min(Math.max(view.k * factor, 0.12), 5);
    const w2 = toWorld(ev.clientX, ev.clientY);
    view.x += w.x - w2.x;
    view.y += w.y - w2.y;
    draw();
  }, { passive: false });

  // ---------- 面板 ----------
  function select(n) {
    selected = n;
    draw();
    if (!n) { detail.innerHTML = '<p class="hint">点击任意节点查看它的 import / 被 import。拖动节点可以挪开重叠，滚轮缩放，空白处拖动平移。</p>'; return; }
    const outs = edges.filter((e) => e.a === n);
    const ins = edges.filter((e) => e.b === n);
    const c = CLUSTERS[n.cluster];
    const li = (e, other, dir) => {
      const t = (e.kind === "dynamic" ? " ⤳" : "") + (e.kind === "asset" ? " ◦" : "");
      return `<li data-goto="${other.id}"><span class="k">${dir}</span> ${other.id}${t}</li>`;
    };
    detail.innerHTML = `
      <h2>${n.label}</h2>
      <div class="path">${n.id}</div>
      <span class="tag" style="background:${c.color}22;color:${c.color}">${c.label}</span>
      <span class="tag" style="background:rgba(255,255,255,.06);color:var(--muted)">${n.lines || "?"} 行 · 入 ${ins.length} / 出 ${outs.length}</span>
      <h3>它 import 了（${outs.length}）</h3>
      ${outs.length ? `<ul>${outs.map((e) => li(e, e.b, "→")).join("")}</ul>` : '<p class="empty">无本地依赖</p>'}
      <h3>谁 import 它（${ins.length}）</h3>
      ${ins.length ? `<ul>${ins.map((e) => li(e, e.a, "←")).join("")}</ul>` : '<p class="empty">没有本地消费者</p>'}
    `;
    detail.querySelectorAll("li[data-goto]").forEach((el) => {
      el.addEventListener("click", () => { const t = byId.get(el.dataset.goto); if (t) { selected = t; select(t); fit([t.id]); draw(); } });
    });
  }

  legendEl.innerHTML =
    ORDER.map((c) => {
      const n = nodes.filter((x) => x.cluster === c).length;
      return `<div class="row" data-cluster="${c}"><span class="dot" style="background:${CLUSTERS[c].color}"></span>${CLUSTERS[c].label}<span class="n">${n}</span></div>`;
    }).join("") +
    `<hr /><div class="key"><span class="swatch" style="border-color:rgba(160,190,220,.9)"></span>跨层依赖</div>
     <div class="key"><span class="swatch" style="border-color:rgba(120,145,175,.55)"></span>同层依赖</div>
     <div class="key"><span class="swatch" style="border-color:#fbbf24;border-top-style:dashed"></span>动态 import()</div>`;
  legendEl.querySelectorAll(".row").forEach((row) => {
    row.addEventListener("click", () => {
      const c = row.dataset.cluster;
      if (offClusters.has(c)) offClusters.delete(c); else offClusters.add(c);
      row.classList.toggle("off");
      draw();
    });
  });

  const engineN = nodes.filter((n) => n.cluster === "engine").length;
  const real = edges.filter((e) => !e.a.asset && !e.b.asset);
  const engineCa = real.filter((e) => e.b.cluster === "engine" && e.a.cluster !== "engine").length;
  const engineCe = real.filter((e) => e.a.cluster === "engine" && e.b.cluster !== "engine").length;
  metricsEl.innerHTML = `
    <div class="metric"><div class="k">模块 / 边</div><div class="v">${nodes.length}<small> / ${real.length}</small></div></div>
    <div class="metric"><div class="k">引擎文件</div><div class="v">${engineN}<small> 个</small></div></div>
    <div class="metric"><div class="k">引擎被依赖</div><div class="v">${engineCa}<small> 条</small></div></div>
    <div class="metric"><div class="k">引擎对外</div><div class="v">${engineCe}<small> 条</small></div></div>
    <div class="metric"><div class="k">SongPage 出度</div><div class="v">${real.filter((e) => e.a.id === "pages/SongPage.tsx").length}<small> 条</small></div></div>
    <div class="metric"><div class="k">MajView 出度</div><div class="v">${real.filter((e) => e.a.id === "components/song/MajView.tsx").length}<small> 条</small></div></div>
  `;

  document.querySelectorAll("button.chip[data-view]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const v = btn.dataset.view;
      if (v === "reset") {
        for (const n of nodes) n.x += (Math.random() - 0.5) * 2;
        simulate(0);
        view.k = 1; fit(); draw(); return;
      }
      mode = v;
      document.querySelectorAll("button.chip[data-view]").forEach((b) => { if (b.dataset.view !== "reset") b.setAttribute("aria-pressed", String(b === btn)); });
      if (v === "focus") fit(nodes.filter((n) => n.cluster === "engine" || n.cluster === "song" || n.cluster === "page").map((n) => n.id));
      draw();
    });
  });

  qEl.addEventListener("input", () => { query = qEl.value.trim().toLowerCase(); draw(); });
  addEventListener("keydown", (ev) => {
    if (ev.key === "/" && document.activeElement !== qEl) { ev.preventDefault(); qEl.focus(); }
    if (ev.key === "Escape") { qEl.value = ""; query = ""; selected = null; qEl.blur(); select(null); }
  });

  // ---------- 启动 ----------
  resize();
  fit();
  draw();
  requestAnimationFrame(() => { fit(); draw(); });
})();
</script>
</body>
</html>
